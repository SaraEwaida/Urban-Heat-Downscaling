[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-heat-downscaling"
version = "0.1.0"
description = "Downscaling 1 km satellite land surface temperature to 30 m using Landsat, vegetation, land cover and elevation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
    "xarray>=2024.1",
    "zarr>=2.17",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
unet = ["torch>=2.2"]

[project.scripts]
uhd = "uhd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

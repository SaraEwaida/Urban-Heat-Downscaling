# Abu Dhabi: island, mainland suburbs, Masdar City, Khalifa City, mangroves and desert edge.
city: abu_dhabi
bbox: [54.30, 24.33, 54.70, 24.52]   # lon_min, lat_min, lon_max, lat_max (WGS84)
crs: EPSG:32640                       # UTM 40N, the native Landsat grid for this area

# Candidate search window for daytime pairs (summer: clear skies, strong heat signal)
search:
  start: "2023-05-01"
  end: "2023-09-30"
  max_landsat_cloud: 10              # eo:cloud_cover, percent
  landsat_platforms: [landsat-8, landsat-9]

coarse:
  collection: modis-11A1-061         # holds both Terra and Aqua items
  product: MOD11A1                   # Terra, ~10:30 local overpass, closest to Landsat (~10:20); Aqua is MYD11A1 (~13:30)
  factor: 31                         # 31 x 30 m = 930 m, nests exactly in the 30 m grid (MODIS is 926.6 m)
  max_lst_error_k: 2                 # QC_Day bits 6-7: keep pixels with LST error <= 2 K

fine:
  max_st_uncertainty_k: 3            # ST_QA (Landsat surface temperature uncertainty), K

# Multi-date stack (milestone 2): clear Landsat days with a same-day Terra pass
dates: ["2023-05-03", "2023-05-11", "2023-05-27", "2023-06-04",
        "2023-06-12", "2023-06-20", "2023-08-23", "2023-09-24"]

# Splits are fixed here, before any model sees the data
splits:
  test_dates: ["2023-08-23", "2023-09-24"]   # latest dates, never used for training
  test_area_east_frac: 0.3                    # eastern 30% of coarse columns, never used for training

# LightGBM pixel model (milestone 3). Early stopping uses val_dates, inside the training area.
lightgbm:
  val_dates: ["2023-06-20"]
  max_train_rows: 1000000
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  num_boost_round: 2000
  early_stopping_rounds: 100
  seed: 0

# U-Net on image patches (milestone 4). Same splits, inputs, target and scored pixels.
unet:
  val_dates: ["2023-06-20"]
  patch_cells: 4                # 4 x 4 coarse cells = 124 x 124 pixels (3.7 km)
  train_stride_cells: 2         # overlapping training patches
  base_channels: 16
  batch_size: 16
  learning_rate: 0.001
  epochs: 40
  patience: 8
  seed: 0

paths:
  scene: data/abu_dhabi/scene.json
  zarr: data/abu_dhabi/aligned.zarr
  figure: outputs/figures/abu_dhabi_input_vs_reference.png
  scenes_dir: data/abu_dhabi/scenes
  stack: data/abu_dhabi/stack.zarr
  splits: outputs/splits.json
  results: outputs/results.csv
  model_lightgbm: data/abu_dhabi/models/lightgbm.txt
  predictions_dir: data/abu_dhabi/predictions
  importance_lightgbm: outputs/lightgbm_importance.csv
  model_unet: data/abu_dhabi/models/unet.pt
  history_unet: outputs/unet_history.csv
